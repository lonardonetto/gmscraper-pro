name: Build Cross-Platform Apps

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # Build Main Scraper App
  build-scraper:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    
    runs-on: ${{ matrix.os }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Install Playwright browsers
      run: npx playwright install chromium
      
    - name: Remove icon files to fix Windows build
      shell: bash
      run: |
        rm -f build/icon.ico build/icon.png build/icon.icns || true
        
    - name: Setup environment for live server
      run: |
        echo "NODE_ENV=production" > .env
        echo "LICENSE_SERVER_URL=https://testing.crmpk.com" >> .env
      
    - name: Create self-signed certificate for macOS
      if: matrix.os == 'macos-latest'
      run: |
        # Create self-signed certificate for code signing
        security create-keychain -p github_actions build.keychain
        security default-keychain -s build.keychain
        security unlock-keychain -p github_actions build.keychain
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k github_actions build.keychain
        
        # Create self-signed signing certificate
        printf '[ req ]\ndefault_bits = 2048\ndistinguished_name = dn\nprompt = no\nstring_mask = utf8only\nx509_extensions = ext\n\n[ dn ]\ncountryName = US\nstateOrProvinceName = California\nlocalityName = San Francisco\norganizationName = GMScraper Pro\ncommonName = GMScraper Pro Developer\n\n[ ext ]\nbasicConstraints = CA:FALSE\nkeyUsage = digitalSignature,keyEncipherment\nextendedKeyUsage = codeSigning\n' > cert.conf
        
        openssl req -x509 -newkey rsa:2048 -keyout signing_key.pem -out signing_cert.pem -days 365 -nodes -config cert.conf
        security import signing_cert.pem -k build.keychain -T /usr/bin/codesign
        security import signing_key.pem -k build.keychain -T /usr/bin/codesign
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k github_actions build.keychain
        
        # Use the certificate directly for signing
        echo "SIGNING_IDENTITY=GMScraper Pro Developer" >> $GITHUB_ENV
      shell: bash

    - name: Build for ${{ matrix.os }}
      run: |
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          npm run build:win
        else
          npm run build:mac
          
          # Sign the macOS app with self-signed certificate
          if [ -f "dist/GMScraper Pro.app" ]; then
            codesign --force --deep --sign "$SIGNING_IDENTITY" "dist/GMScraper Pro.app"
            echo "Signed GMScraper Pro.app"
          fi
          
          # Sign the DMG if it exists
          if [ -f "dist/*.dmg" ]; then
            codesign --force --sign "$SIGNING_IDENTITY" dist/*.dmg
            echo "Signed DMG file"
          fi
        fi
      shell: bash
      
    - name: Upload Windows artifacts
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v4
      with:
        name: scraper-windows
        path: |
          dist/*.exe
          dist/*.zip
        retention-days: 30
        
    - name: Upload macOS artifacts
      if: matrix.os == 'macos-latest'
      uses: actions/upload-artifact@v4
      with:
        name: scraper-macos
        path: |
          dist/*.dmg
          dist/*.zip
        retention-days: 30

  # Build Keygen GUI
  build-keygen:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    
    runs-on: ${{ matrix.os }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: keygen-gui/package-lock.json
        
    - name: Install keygen dependencies
      working-directory: keygen-gui
      run: npm ci
      
    - name: Remove icon files to fix keygen build
      working-directory: keygen-gui
      shell: bash
      run: |
        rm -f build/icon.ico build/icon.png build/icon.icns || true
        
    - name: Setup keygen environment for live server
      working-directory: keygen-gui
      run: |
        echo "LICENSE_SERVER_URL=https://testing.crmpk.com" > .env
      
    - name: Create self-signed certificate for macOS
      if: matrix.os == 'macos-latest'
      run: |
        # Create self-signed certificate for code signing
        security create-keychain -p github_actions build.keychain
        security default-keychain -s build.keychain
        security unlock-keychain -p github_actions build.keychain
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k github_actions build.keychain
        
        # Create self-signed signing certificate
        printf '[ req ]\ndefault_bits = 2048\ndistinguished_name = dn\nprompt = no\nstring_mask = utf8only\nx509_extensions = ext\n\n[ dn ]\ncountryName = US\nstateOrProvinceName = California\nlocalityName = San Francisco\norganizationName = GMScraper Pro\ncommonName = GMScraper Pro Developer\n\n[ ext ]\nbasicConstraints = CA:FALSE\nkeyUsage = digitalSignature,keyEncipherment\nextendedKeyUsage = codeSigning\n' > cert.conf
        
        openssl req -x509 -newkey rsa:2048 -keyout signing_key.pem -out signing_cert.pem -days 365 -nodes -config cert.conf
        security import signing_cert.pem -k build.keychain -T /usr/bin/codesign
        security import signing_key.pem -k build.keychain -T /usr/bin/codesign
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k github_actions build.keychain
        
        # Use the certificate directly for signing
        echo "SIGNING_IDENTITY=GMScraper Pro Developer" >> $GITHUB_ENV
      shell: bash

    - name: Build keygen for ${{ matrix.os }}
      working-directory: keygen-gui
      run: |
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          npm run build:win
        else
          npm run build:mac
          
          # Sign the macOS app with self-signed certificate
          if [ -f "dist/GMScraper Keygen.app" ]; then
            codesign --force --deep --sign "$SIGNING_IDENTITY" "dist/GMScraper Keygen.app"
            echo "Signed GMScraper Keygen.app"
          fi
          
          # Sign the DMG if it exists
          if [ -f "dist/*.dmg" ]; then
            codesign --force --sign "$SIGNING_IDENTITY" dist/*.dmg
            echo "Signed DMG file"
          fi
        fi
      shell: bash
      
    - name: Upload Windows keygen artifacts
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v4
      with:
        name: keygen-windows
        path: keygen-gui/dist/*.exe
        retention-days: 30
        
    - name: Upload macOS keygen artifacts
      if: matrix.os == 'macos-latest'
      uses: actions/upload-artifact@v4
      with:
        name: keygen-macos
        path: keygen-gui/dist/*.dmg
        retention-days: 30

  # Create Release (only on tags)
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-scraper, build-keygen]
    runs-on: ubuntu-latest
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          scraper-windows/**/*
          scraper-macos/**/*
          keygen-windows/**/*
          keygen-macos/**/*
        draft: false
        prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
